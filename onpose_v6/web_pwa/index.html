<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#1a1a26">
  <link rel="manifest" href="manifest.json">
  <title>OnPose v6 Web</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #1a1a26; color: #f0f0f0; font-family: 'Malgun Gothic', sans-serif;
           min-height: 100vh; display: flex; flex-direction: column; align-items: center;
           padding: 12px; }
    h1 { color: #7ec0ff; margin: 8px 0 4px 0; font-size: 22px; }
    .sub { color: #999; font-size: 13px; margin-bottom: 12px; }
    .stage { width: 100%; max-width: 480px; aspect-ratio: 4/3; background: #000;
             border-radius: 12px; overflow: hidden; position: relative; }
    video, canvas { width: 100%; height: 100%; object-fit: cover; }
    canvas { position: absolute; inset: 0; }
    .controls { width: 100%; max-width: 480px; margin-top: 12px; display: grid;
                grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    button { padding: 14px 8px; background: #2a2a3e; color: #f0f0f0;
             border: 1px solid #353550; border-radius: 8px; font-size: 14px;
             cursor: pointer; transition: all 0.2s; }
    button:hover { background: #353550; border-color: #5ed4f0; }
    button.active { background: #1f3a30; border-color: #5ce0a3; color: #5ce0a3; }
    .panel { width: 100%; max-width: 480px; margin-top: 12px; padding: 16px;
             background: #2a2a3e; border-radius: 12px; }
    .score { font-size: 64px; font-weight: 700; line-height: 1; }
    .score.good { color: #5ce0a3; } .score.ok { color: #5ed4f0; }
    .score.warn { color: #f5c34a; } .score.bad { color: #f06b6b; }
    .row { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
    .bar-bg { flex: 1; background: #353550; height: 18px; border-radius: 4px; overflow: hidden; }
    .bar-fill { height: 100%; transition: width 0.4s; }
    .feedback { background: #232336; border-left: 3px solid #ffd66b; padding: 12px 14px;
                border-radius: 6px; margin-top: 12px; line-height: 1.5; font-size: 14px; }
    #status { color: #5ed4f0; font-size: 14px; margin: 8px 0; min-height: 20px; }
  </style>
</head>
<body>
  <h1>OnPose v6 Web (PWA)</h1>
  <div class="sub">브라우저만으로 동작 · 완전 오프라인 · 모바일 친화</div>
  <div class="stage">
    <video id="cam" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>
  <div id="status">▶ 카메라 권한을 허용하면 시작합니다</div>
  <div class="controls">
    <button id="btn-seal">더 씰</button>
    <button id="btn-stretch">스파인 스트레치</button>
    <button id="btn-bridging">브릿징</button>
  </div>
  <div class="panel" id="panel" style="display: none;">
    <div class="row"><span class="score" id="score">--</span>
      <span style="margin-left: 12px;">
        <div>O/X <b id="ox">--%</b></div>
        <div id="verdict" style="font-size: 18px; margin-top: 4px;">--</div>
      </span>
    </div>
    <div id="bars"></div>
    <div class="feedback" id="feedback">측정 시작 전입니다</div>
  </div>

  <script type="module">
    /*
     * OnPose Web PWA — 핵심 구조 데모 (실제 ML 추론은 별도 통합 필요)
     *
     * 풀 동작을 위해 추가해야 할 것:
     *   1. MediaPipe Tasks Vision (web) <https://developers.google.com/mediapipe/solutions/setup_web>
     *   2. ONNX Runtime Web (lifter int8 추론) <https://onnxruntime.ai/docs/get-started/with-javascript.html>
     *   3. onpose_metadata.json 로드 → AngleScorer (JS 직역)
     *
     * 이 스켈레톤은 카메라 + UI 흐름만 데모합니다.
     */
    const video = document.getElementById('cam');
    const overlay = document.getElementById('overlay');
    const status = document.getElementById('status');
    const panel = document.getElementById('panel');
    const ctx = overlay.getContext('2d');

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 480 }, height: { ideal: 360 } },
          audio: false,
        });
        video.srcObject = stream;
        video.addEventListener('loadedmetadata', () => {
          overlay.width = video.videoWidth;
          overlay.height = video.videoHeight;
          status.textContent = '✓ 카메라 준비됨. 자세 박스를 눌러 시작하세요';
        });
      } catch (e) {
        status.textContent = '⚠ 카메라 권한이 필요합니다: ' + e.message;
      }
    }

    // 메타데이터 (실제로는 onpose_metadata.json fetch)
    const POSE_NAME = { 'btn-seal': '더 씰', 'btn-stretch': '스파인 스트레치', 'btn-bridging': '브릿징' };
    let selectedPose = null;

    document.querySelectorAll('.controls button').forEach(btn => {
      btn.addEventListener('click', async () => {
        document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedPose = POSE_NAME[btn.id];
        status.textContent = `▶ ${selectedPose} 시작 — 자세를 취해 주세요`;
        panel.style.display = 'block';

        // 3초 후 5초간 측정 시뮬레이션
        await sleep(1000);
        status.textContent = `🔴 측정 중...`;
        await sleep(3000);
        status.textContent = `✨ 분석 중...`;
        await sleep(800);

        // 결과 화면 (데모 — 실제 ML 통합 시 진짜 점수)
        const score = 80 + Math.random() * 15;
        const ox = score >= 80 ? 80 + Math.random() * 15 : score - 10 + Math.random() * 15;
        renderResult(selectedPose, score, ox);
        status.textContent = `🏁 ${selectedPose} 결과`;
      });
    });

    function colorFor(s) {
      if (s >= 85) return ['good', '#5ce0a3', '훌륭해요'];
      if (s >= 70) return ['ok', '#5ed4f0', '좋아요'];
      if (s >= 55) return ['warn', '#f5c34a', '조금 더'];
      return ['bad', '#f06b6b', '다시 도전'];
    }

    function renderResult(pose, score, ox) {
      const [cls, color, verdict] = colorFor(score);
      const sc = document.getElementById('score');
      sc.textContent = Math.round(score);
      sc.className = 'score ' + cls;
      document.getElementById('ox').textContent = ox.toFixed(0) + '%';
      document.getElementById('ox').style.color = color;
      document.getElementById('verdict').textContent = verdict;
      document.getElementById('verdict').style.color = color;

      const angles = { '무릎': 80 + Math.random() * 20, '고관절': 85 + Math.random() * 15,
                       '상체': 60 + Math.random() * 30 };
      const bars = document.getElementById('bars');
      bars.innerHTML = '';
      for (const [name, pct] of Object.entries(angles)) {
        const [, c] = colorFor(pct);
        bars.innerHTML += `<div class="row"><span style="width:60px">${name}</span>` +
          `<div class="bar-bg"><div class="bar-fill" style="width:${pct}%; background:${c}"></div></div>` +
          `<span style="width:60px; text-align:right">${pct.toFixed(0)}%</span></div>`;
      }
      document.getElementById('feedback').textContent =
        `${pose} 자세 정말 잘 따라오셨어요! 핵심 각도가 정답 근처에 들어와서 ${verdict} 수준이에요. 다음에는 상체 정렬을 길게 늘인다는 느낌으로 가져가 보세요!`;
    }

    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
    startCamera();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
